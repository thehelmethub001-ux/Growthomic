
[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false  # Only admin can create accounts (single-tenant)
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = false
enable_confirmations = false
double_confirm_changes = true

[edge_runtime]
enabled = true
inspector_port = 8083

[functions.webhook-meta]
verify_jwt = false  # Meta webhooks have their own HMAC verification

[functions.queue-processor]
verify_jwt = false  # QStash has its own signature verification

[functions.followup-handler]
verify_jwt = false  # QStash has its own signature verification

[functions.woo-retry]
verify_jwt = false  # QStash has its own signature verification

[analytics]
enabled = true
port = 54327
vector_port = 54328
backend = "postgres"

[functions.test-agent]
enabled = true
verify_jwt = false
import_map = "./functions/test-agent/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/test-agent/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/test-agent/*.html" ]

[functions.test-ai-agent]
enabled = true
verify_jwt = false
import_map = "./functions/test-ai-agent/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/test-ai-agent/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/test-ai-agent/*.html" ]
